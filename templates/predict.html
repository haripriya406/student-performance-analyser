
{% extends "base.html" %}

{% block title %}Predict | Student Performance Analyser{% endblock %}

{% block content %}
<div class="card">
    <h1>Student Academic Risk Prediction</h1>
    <p>Enter the student's details to predict their academic risk.</p>

    <form id="predictionForm">
        <label>Age</label>
        <input type="number" name="age" min="10" max="100" value="17" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label>Study Hours Per Day</label>
        <input type="number" name="study_hours_per_day" min="0" max="24" step="0.5" value="3" required>

        <label>Attendance Percentage</label>
        <input type="number" name="attendance_percentage" min="0" max="100" value="80" required>

        <label>Previous Score</label>
        <input type="number" name="previous_score" min="0" max="100" value="60" required>

        <label>Assignments Completed (out of 10)</label>
        <input type="number" name="assignments_completed_out_of_10" min="0" max="10" value="7" required>

        <label>Sleep Hours Per Day</label>
        <input type="number" name="sleep_hours_per_day" min="0" max="24" step="0.5" value="7" required>

        <label>Internet Access</label>
        <select name="internet_access" required>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <label>Parental Support</label>
        <select name="parental_support" required>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>

        <label>Extracurricular Hours Per Week</label>
        <input type="number" name="extracurricular_hours_per_week" min="0" max="168" step="0.5" value="4" required>

        <label>Family Income Level</label>
        <select name="family_income_level" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button type="submit">Predict Academic Risk</button>
    </form>

    <div id="result" class="card" style="display:none; margin-top:20px;">
        <h2>Prediction Result</h2>
        <p id="predictionText"></p>
    </div>

    <p id="errorMessage" style="color:#dc2626;"></p>
</div>

<script>
document.getElementById("predictionForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const formData = new FormData(this);
    const student = {};

    formData.forEach((value, key) => {
        student[key] = value;
    });

    const errorMessage = document.getElementById("errorMessage");
    const result = document.getElementById("result");
    const predictionText = document.getElementById("predictionText");

    errorMessage.textContent = "";
    result.style.display = "none";

    try {
        const response = await fetch("/api/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(student)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Prediction failed.");
        }

        predictionText.textContent =
            "Predicted academic risk: " +
            (data.prediction ?? data.academic_risk ?? JSON.stringify(data));

        result.style.display = "block";
    } catch (error) {
        errorMessage.textContent = "Error: " + error.message;
    }
});
</script>
{% endblock %}
