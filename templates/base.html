
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Performance Analyser{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        nav {
            background: #173b68;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 18px;
        }

        nav .brand {
            font-size: 21px;
            font-weight: bold;
        }

        main {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
            min-height: 65vh;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 14px #0000000d;
            margin-bottom: 20px;
        }

        h1, h2 {
            color: #173b68;
        }

        button, .button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 7px 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #eaf1fb;
        }

        footer {
            text-align: center;
            padding: 22px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="{{ url_for('dashboard') }}">Student Performance Analyser</a>
        <div>
            <a href="{{ url_for('dashboard') }}">Home</a>
            <a href="{{ url_for('predict') }}">Predict</a>
            <a href="{{ url_for('students') }}">Students</a>
            <a href="{{ url_for('evaluation') }}">Evaluation</a>
            <a href="{{ url_for('dataset') }}">Dataset</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        Student Performance Analyser | Academic Project
    </footer>
</body>
</html>
